<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ナッシュ均衡の課題｜ジレンマ劇場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--gc:#2f6fb0;--aBg:#DCEBFA;--aFg:#173F70;--bBg:#FCE7D6;--bFg:#85420F}
.tagA,.tagB{display:inline-block;border-radius:12px;padding:3px 12px;font-weight:700;font-size:.95rem;white-space:nowrap}
.tagA{background:var(--aBg);color:var(--aFg)}.tagB{background:var(--bBg);color:var(--bFg)}
.va{color:var(--aFg)}.vb{color:var(--bFg)}
.qm{border-collapse:collapse;margin:10px auto}
.qm th{font-weight:700;padding:4px 8px;text-align:center}
.qm th.r{text-align:right}
.qm td{border:2px solid #555;min-width:92px;height:62px;text-align:center;font-size:1.25rem;font-weight:700;background:#fff;position:relative;font-variant-numeric:tabular-nums}
.qm td.pick{cursor:pointer;user-select:none}
.qm td.pick:hover{background:#fffbe9}
.qm td.sel{background:#fff1bf;box-shadow:inset 0 0 0 3px #f2c14e}
.qm td.sel::after{content:'★';position:absolute;top:2px;right:6px;font-size:.85rem;color:#b88a00}
.qm td.ne{background:#fff1bf}
.qm td.ne::after{content:'★ 均衡';position:absolute;top:-11px;right:4px;font-size:.7rem;background:#f2c14e;border:1.5px solid var(--ink);border-radius:999px;padding:0 6px;color:var(--ink)}
.qm .ring{border:2.5px solid currentColor;border-radius:999px;padding:0 4px}
.qm .tag-row{padding-right:10px}
.qcard{border-left:6px solid var(--gc)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.qno{font-family:'Mochiy Pop One',sans-serif;font-size:1.25rem}
.none{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:6px;font-weight:700;cursor:pointer}
.none input{width:20px;height:20px}
.ans{display:grid;grid-template-columns:auto 160px;gap:8px 12px;align-items:center;justify-content:center;margin-top:10px}
.ans input{width:160px;font:inherit;font-size:1.1rem;border:3px solid var(--ink);border-radius:10px;padding:6px 10px;text-align:center}
.ans label{font-weight:700;text-align:right}
.ok{color:var(--good);font-weight:900}.ng{color:var(--bad);font-weight:900}
.expl{background:var(--paper2);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.95rem;line-height:1.8}
.score{font-family:'Mochiy Pop One',sans-serif;font-size:3rem;text-align:center;line-height:1.2}
.sec{font-family:'Mochiy Pop One',sans-serif;font-size:1.2rem;margin:26px 0 4px}
.legend2{font-size:.85rem;text-align:center;color:var(--ink2)}
@media (max-width:560px){.qm td{min-width:70px;height:54px;font-size:1.05rem}.ans{grid-template-columns:1fr}.ans label{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <div id="course" class="course hidden"></div>
  <header class="topbar">
    <a class="brand" href="index.html"><b id="siteTitle">ジレンマ劇場</b><span>ナッシュ均衡の課題</span></a>
    <nav class="toplinks"><a class="chiplink" href="index.html">ゲーム一覧</a></nav>
  </header>
  <div id="demoBanner" class="demo-banner hidden">デモモードで動いています（提出はこのブラウザの中だけに保存されます）。</div>
  <main id="app" aria-live="polite"></main>
</div>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
